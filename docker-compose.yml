version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: aistoryteller-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ai_story_teller
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - aistoryteller-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ai_story_teller --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./ai-story-teller-backend-python
      dockerfile: Dockerfile
    container_name: aistoryteller-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./ai-story-teller-backend-python/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=ai_story_teller
    volumes:
      - ./ai-story-teller-backend-python/chroma_db:/app/chroma_db
      - ./ai-story-teller-backend-python/logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - aistoryteller-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./ai-story-teller-frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:8000
    container_name: aistoryteller-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - aistoryteller-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  mongodb_data:
    driver: local

networks:
  aistoryteller-network:
    driver: bridge
